# 六类标签定义
# 一条资讯可贴多个标签（多标签归类）
#
# 字段说明:
#   id        - 标签标识（存入表格）
#   name      - 中文名称
#   desc      - 判定标准，供 LLM 归类时参考
#   examples  - 典型例子，帮助模型理解

tags:
  - id: frontier_tech
    name: 前沿技术
    desc: 具身智能领域的新算法、新架构、新方法论、学术突破
    examples: ["VLA模型发布", "世界模型", "强化学习新方法", "灵巧操作算法", "具身基础模型"]

  - id: industry_knowledge
    name: 行业知识
    desc: 行业科普、技术解读、产业报告、趋势分析、白皮书
    examples: ["产业链深度解读", "技术路线对比", "市场报告", "人才/成本分析"]

  - id: competitor
    name: 竞品动态
    desc: 竞争对手公司（国内外具身智能/人形机器人厂商）的产品、战略、合作、量产动态
    examples: ["特斯拉Optimus进展", "宇树科技发布", "Figure合作", "智元新动向"]

  - id: product_launch
    name: 新品发布
    desc: 新产品/新版本发布、开售、量产下线
    examples: ["人形机器人新品发布", "灵巧手新品", "新一代控制器/关节"]

  - id: funding
    name: 商业融资
    desc: 融资、并购、上市、订单、营收等商业资本动态
    examples: ["某某轮融资", "被收购", "IPO", "大额订单", "设立子公司"]

  - id: teardown
    name: 拆机实测
    desc: 产品拆解、硬件评测、实测数据、零部件供应商分析
    examples: ["机器人拆解报告", "关节电机实测", "传感器供应商曝光", "零部件BOM分析"]
